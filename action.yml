---
# https://help.github.com/en/articles/metadata-syntax-for-github-actions
name: 'download-artifact-retry'
description: "GitHub Action to download an artifact with retry functionality."
author: 'cytopia'
branding:
  icon: 'code'
  color: 'red'

inputs:
  name:
    description: 'The artifact name to download.'
    required: true
  path:
    description: 'The local path to download to (defaults to current working directory).'
    required: false
    default: '.'

runs:
  using: "composite"
  steps:

    - name: download artifact (try-1)
      id: download-1
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - name: Diagnose available artifacts
      if: steps.download-1.outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "::warning::Download failed. Requested: ${{ inputs.name }}"
        echo "Available artifacts in run ${{ github.run_id }}:"
        gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          --jq '.artifacts[] | "\(.id)  \(.name)  expired=\(.expired)"' \
          || echo "::warning::Failed to list artifacts. Ensure the token has 'actions: read' permission."

    - name: Wait before retry
      if: steps.download-1.outcome == 'failure'
      run: sleep 30
      shell: bash

    - name: download artifact (try-2)
      id: download-2
      if: ${{ steps.download-1.outcome == 'failure' }}
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - name: Wait before retry
      if: steps.download-2.outcome == 'failure'
      run: sleep 30
      shell: bash

    - name: download artifact (try-3)
      id: download-3
      if: ${{ steps.download-2.outcome == 'failure' }}
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
